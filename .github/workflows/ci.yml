name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Import check
        run: python -c "import rrplot; print(rrplot.__name__)"

      - name: Run tests with coverage
        run: >-
          python -m pytest --cov=rrplot --cov-report=term-missing
          --cov-fail-under=90

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run every example (smoke)
        run: |
          set -e
          for f in examples/*.py; do
            echo "== $f"
            python "$f"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        run: python -m pip install -e ".[docs]"

      - name: Build docs
        run: python -m sphinx -b html docs docs/_build/html

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.15.13

      - name: Ruff check
        run: ruff check rrplot tests examples

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install build twine
          python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean target
        run: |
          python -m venv /tmp/rrplot-wheel-check
          /tmp/rrplot-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/rrplot-wheel-check/bin/python -c "import rrplot, cycleplot; assert rrplot.__version__ == cycleplot.__version__"
