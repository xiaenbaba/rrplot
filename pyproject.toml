[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rrplot"
dynamic = ["version"]
description = "通用制冷循环 / HVAC 示意图绘制库:坐标式部件拼装 + 走线式连管,输出 PNG/PDF/SVG"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xiaenbaba" }]
keywords = ["refrigeration", "hvac", "diagram", "matplotlib", "schematic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.23,<3",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=7,<10", "pytest-cov>=4,<8"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4"]

[project.urls]
Repository = "https://github.com/xiaenbaba/rrplot"

[tool.setuptools.packages.find]
include = ["rrplot*", "cycleplot*"]

[tool.setuptools.dynamic]
version = { attr = "rrplot.__version__" }

[tool.setuptools.package-data]
rrplot = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
